<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Background rounded square -->
  <rect width="128" height="128" rx="22" fill="#1a2238"/>

  <!-- Outer glow ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#e63946" stroke-width="3" opacity="0.4"/>

  <!-- Phone handset body (rounded rectangle at angle) -->
  <g transform="translate(64,64) rotate(-35)">
    <!-- Handset earpiece -->
    <rect x="-10" y="-36" width="20" height="14" rx="6" fill="#e63946"/>
    <!-- Handset bridge -->
    <rect x="-5" y="-22" width="10" height="44" rx="3" fill="#e63946"/>
    <!-- Handset mouthpiece -->
    <rect x="-10" y="22" width="20" height="14" rx="6" fill="#e63946"/>
  </g>

  <!-- Dispatch star badge (bottom-right) -->
  <g transform="translate(88, 88)">
    <circle r="18" fill="#f4a261"/>
    <!-- Star -->
    <polygon points="0,-11 2.6,-7 7,-7 3.5,-4 5,-0 0,-3 -5,-0 -3.5,-4 -7,-7 -2.6,-7"
             fill="#1a2238" transform="scale(1.1)"/>
  </g>

  <!-- Small radio wave lines (top-left) -->
  <path d="M28 30 Q18 44 28 58" fill="none" stroke="#e63946" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M20 24 Q5 44 20 64" fill="none" stroke="#e63946" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
</svg>
